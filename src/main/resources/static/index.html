<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registro de Clientes - ChurnInsight</title>
    <!-- Agregamos ?v=2.0 para forzar la recarga del CSS y evitar caché -->
    <link rel="stylesheet" href="css/index.css?v=2.0">
</head>
<body>

<!-- Tarjeta 0: Acciones Rápidas (Opción B) -->
<div class="card action-card">
    <h3>¿Tienes muchos datos?</h3>
    <p style="margin-bottom: 1rem; color: #555;">
        Puedes cargar un archivo CSV con múltiples clientes para procesar predicciones de forma masiva.
    </p>
    <a href="batch-upload.html" class="btn-batch">Ir a Carga Masiva (CSV)</a>
</div>

<!-- Tarjeta 1: Formulario de Registro -->
<div class="card">
    <h3>Registrar Nuevo Cliente</h3>
    <form id="clienteForm">
        <div class="form-group">
            <label for="name">Nombre Completo:</label>
            <input type="text" id="name" name="name" placeholder="Ej: Juan Pérez" required>
        </div>

        <div class="form-group">
            <label for="externalId">ID de Negocio (External ID):</label>
            <input type="text" id="externalId" name="externalId" placeholder="Ej: CUST-999" required>
        </div>

        <button type="submit">Guardar Cliente</button>
    </form>
    <div id="mensaje"></div>
</div>

<!-- Tarjeta 2: Lista de Clientes -->
<div class="card">
    <h3>Lista de Clientes Registrados</h3>
    <table id="customersTable">
        <thead>
        <tr>
            <th>ID Externo</th>
            <th>Nombre</th>
            <th>Acciones</th>
        </tr>
        </thead>
        <tbody>
        <!-- Aquí se insertarán las filas dinámicamente -->
        </tbody>
    </table>
</div>

<script src="js/index.js?v=2.0"></script>
</body>
</html>
