<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Predicciones de Churn - ChurnInsight</title>
    <link rel="stylesheet" href="css/predictions.css">
</head>
<body>

<a href="index.html" class="back-link">← Volver a la lista de clientes</a>

<!-- DIV 1: Información del Cliente -->
<div id="customerInfo" class="card">
    <h3>Información del Cliente</h3>
    <p><strong>ID Externo:</strong> <span id="displayExternalId">Cargando...</span></p>
    <p><strong>Nombre:</strong> <span id="displayName">Cargando...</span></p>
</div>

<!-- DIV 2: Formulario de Predicción -->
<div class="card">
    <h3>Nueva Predicción de Churn</h3>
    <form id="predictionForm">
        <!-- Campos Numéricos -->
        <div class="form-group">
            <label for="Meses_contrato">Meses de Contrato (Tenure):</label>
            <input type="number" id="Meses_contrato" name="Meses_contrato" step="1" min="0" required>
        </div>

        <div class="form-group">
            <label for="Total">Total Facturado ($):</label>
            <input type="number" id="Total" name="Total" step="0.01" min="0" required>
        </div>

        <div class="form-group">
            <label for="Factura_mensual">Factura Mensual ($):</label>
            <input type="number" id="Factura_mensual" name="Factura_mensual" step="0.01" min="0" required>
        </div>

        <!-- Campos Booleanos (Checkboxes) -->
        <div class="checkbox-group">
            <input type="checkbox" id="Contrato_mensual" name="Contrato_mensual">
            <label for="Contrato_mensual">Contrato Mensual</label>
        </div>

        <div class="checkbox-group">
            <input type="checkbox" id="Pago_chequera_electronica" name="Pago_chequera_electronica">
            <label for="Pago_chequera_electronica">Pago con Chequera Electrónica</label>
        </div>

        <div class="checkbox-group">
            <input type="checkbox" id="Soporte_tecnico" name="Soporte_tecnico">
            <label for="Soporte_tecnico">Tiene Soporte Técnico</label>
        </div>

        <div class="checkbox-group">
            <input type="checkbox" id="Seguridad_online" name="Seguridad_online">
            <label for="Seguridad_online">Tiene Seguridad Online</label>
        </div>

        <div class="checkbox-group">
            <input type="checkbox" id="Contrato_2_años" name="Contrato_2_años">
            <label for="Contrato_2_años">Contrato de 2 Años</label>
        </div>

        <div class="checkbox-group">
            <input type="checkbox" id="Factura_online" name="Factura_online">
            <label for="Factura_online">Facturación Online</label>
        </div>

        <div class="checkbox-group">
            <input type="checkbox" id="Contrato_1_año" name="Contrato_1_año">
            <label for="Contrato_1_año">Contrato de 1 Año</label>
        </div>

        <button type="submit">Calcular Predicción</button>
    </form>
</div>

<!-- DIV 3: Resultado de la Predicción -->
<div id="predictionResult" class="result-box">
    <!-- Aquí se mostrará el resultado -->
</div>

<script src="js/predictions.js"></script>

</body>
</html>
